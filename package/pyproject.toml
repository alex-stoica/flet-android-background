[project]
name = "flet-android-background"
version = "0.0.2"
description = "Experimental foreground tasks for Flet on Android"
readme = "README.md"
license = "MIT"
authors = [{name = "Alex Stoica", email = "alexstoica@protonmail.com"}]
requires-python = ">=3.11"
dependencies = ["flet>=0.82.0,<2.0.0"]
classifiers = ["Development Status :: 3 - Alpha"]

[project.urls]
Homepage = "https://github.com/alex-stoica/flet-android-background"
Repository = "https://github.com/alex-stoica/flet-android-background"
Issues = "https://github.com/alex-stoica/flet-android-background/issues"

[build-system]
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flet_android_background", "src/flutter"]
